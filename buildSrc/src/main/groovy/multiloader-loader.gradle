plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':Common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':Common', configuration: 'commonJava')
    commonResources project(path: ':Common', configuration: 'commonResources')
}

ext.registerProcessDocsTask = { String loaderName, String loaderVersion, String extraDocRequirements ->
    tasks.register('processDocs', Copy) {
        from(rootProject.file('doc')) {
            include '*.md'
            expand(
                    loaderversion: loaderVersion,
                    loadername: loaderName,
                    api_version: api_version,
                    journeymap_doc_version: journeymap_doc_version,
                    extra_doc_requirements: extraDocRequirements
            )
        }
        into(layout.buildDirectory.dir('doc'))
    }
}

if (!project.hasProperty("curseForgeApiKey")) {
    ext.curseForgeApiKey = project.findProperty("curseforge_api_key") ?: "notset"
}
if (!project.hasProperty("modrinthApiKey")) {
    ext.modrinthApiKey = project.findProperty("modrinth_api_key") ?: "notset"
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

afterEvaluate {
    // Declare capabilities on the outgoing loader variants after each loader sets its final archive name.
    ['apiElements', 'runtimeElements', 'sourcesElements'/*, 'javadocElements'*/].each { variant ->
        def configuration = configurations.findByName(variant)
        if (configuration == null) {
            return
        }
        configuration.outgoing {
            capability("$group:${base.archivesName.get()}:$version")
            capability("$group:$mod_id:$version")
        }
        publishing.publications.configureEach {
            suppressPomMetadataWarningsFor(variant)
        }
    }
}

tasks.configureEach {
    if (name.startsWith('curseforge') || name.startsWith('modrinth')) {
        dependsOn(tasks.named('build'))
    }
}
