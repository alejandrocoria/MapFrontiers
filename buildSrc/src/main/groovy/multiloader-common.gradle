plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    // used for local mods in the libs folder
    flatDir {
        dirs 'libs'
    }

    mavenLocal()
    if (api_version.endsWith('-SNAPSHOT')) {
        maven {
            name = 'Central Portal Snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
            content {
                includeModule('games.alejandrocoria', 'mapfrontiers-api')
            }
        }
    }
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    exclusiveContent {
        forRepositories(
                mavenLocal(),
                maven {
                    name = 'JourneyMap API and CommonNetworking'
                    url = 'https://jm.gserv.me/repository/maven-public/'
                }
        )
        filter {
            includeGroupAndSubgroups("info.journeymap")
            includeGroupAndSubgroups("mysticdrew")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'JourneyMap Mod'
                url = 'https://www.cursemaven.com'
            }
        }
        filter {
            includeGroupAndSubgroups("curse.maven")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroupAndSubgroups("maven.modrinth")
        }
    }
    maven {
        name = 'ModMenu'
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
    }
}

// Common exposes the shared mod capability so loader projects can depend on it as a local project variant.
['apiElements', 'runtimeElements', 'sourcesElements'/*, 'javadocElements'*/].each { variant ->
    def configuration = configurations.findByName(variant)
    if (configuration == null) {
        return
    }
    configuration.outgoing {
        capability("$group:$mod_id:$version")
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def expandProps = [
            "version":                              version,
            "group":                                project.group, //Else we target the task's group.
            "java_version":                         java_version,
            "minecraft_version":                    minecraft_version,
            "minecraft_version_range":              minecraft_version_range,
            "mod_name":                             mod_name,
            "mod_author":                           mod_author,
            "mod_id":                               mod_id,
            "mod_description":                      mod_description,
            "mod_email":                            mod_email,
            "mod_homepage":                         mod_homepage,
            "mod_issues":                           mod_issues,
            "mod_sources":                          mod_sources,
            "mod_credits":                          mod_credits,
            "mod_license":                          mod_license,
            "mod_logo":                             mod_logo,
            "fabric_version":                       fabric_version,
            "fabric_loader_version":                fabric_loader_version,
            "forge_version":                        forge_version,
            "forge_loader_version_range":           forge_loader_version_range,
            "journeymap_min_version":               journeymap_min_version,
            "journeymap_version_range":             journeymap_version_range
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
