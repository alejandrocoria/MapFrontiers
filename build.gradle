plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.17-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev.legacyforge' version '2.0.140' apply false
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

tasks.configureEach { task ->
    if (task instanceof Copy || task instanceof AbstractArchiveTask) {
        task.duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

tasks.register("publishMod") {
    group = "release"
    description = "Publishes Fabric and Forge builds to CurseForge and Modrinth."
    dependsOn(
            ":Fabric:publishCurseForge",
            ":Forge:publishCurseForge",
            ":Fabric:modrinth",
            ":Forge:modrinth"
    )
}
