import com.modrinth.minotaur.dependencies.VersionDependency
import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.minecraftforge.accesstransformers' version '5.0.2'
    id 'net.minecraftforge.gradle' version '[7.0.2,8.0)'
    // Reobfuscates the shipped jar (classes + access transformers) to SRG names -
    // required for Forge 1.20.1's SRG runtime. FG7 compiles against MOJMAP.
    id 'net.minecraftforge.renamer' version '1.1.0'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "com.modrinth.minotaur" version "2.9.0"
}

base.archivesName = "${project.mod_name}-${project.minecraft_version}-forge"

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = 'Fabric'
        url = uri('https://maven.fabricmc.net')
    }
    mavenCentral()
}

configurations {
    embeddedApi {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    def apiIsSnapshot = project.api_version.endsWith('-SNAPSHOT')

    implementation("${project.api_group}:${project.api_artifact_id}:${project.api_version}") {
        changing = apiIsSnapshot
    }
    embeddedApi("${project.api_group}:${project.api_artifact_id}:${project.api_version}") {
        changing = apiIsSnapshot
    }

    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
    implementation renamer.dependency("mysticdrew:common-networking-forge:${project.common_networking_version}")
    api("info.journeymap:journeymap-api-forge:${project.journeymap_api_version}") {
        changing = true
    }
    implementation renamer.dependency("curse.maven:journeymap-${project.jm_project_id}:${project.jm_forge_file_id}")
}

renamer.mappings.from minecraft.dependency.toSrgFile

minecraft {
    mappings channel: "official", version: minecraft_version

    def at = project(':Common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = files(at)
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            args "--mixin.config=${mod_id}.mixins.json"
            args "--mixin.config=${mod_id}.forge.mixins.json"
            systemProperty "mixin.debug.export", "true"
            systemProperty "mixin.env.remapRefMap", "true"
            systemProperty "mixin.env.refMapRemappingFile", "${buildDir}/createSrgToMcp/output.srg"
        }

        client {
            workingDir.convention layout.projectDirectory.dir("runs/client")
        }

        server {
            workingDir.convention layout.projectDirectory.dir("runs/server")
            args '--nogui'
        }
    }
}

idea {
    module {
        excludeDirs += file('runs')
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

jar {
    dependsOn "processDocs"
    from({
        configurations.embeddedApi.collect { zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}


registerProcessDocsTask(
        "Forge",
        forge_version,
        ""
)

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, jar)
    mainFile.displayName = "${minecraft_version}-${version}-forge"
    mainFile.releaseType = release_type
    mainFile.addModLoader("Forge")
    mainFile.addJavaVersion("Java 17")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addEnvironment("Server", "Client")
    mainFile.addRelations("requiredDependency", "journeymap")
    mainFile.changelogType = "markdown"
    mainFile.changelog = file("$project.buildDir/doc/changelog.md")
}

modrinth {
//    debugMode.set(true)
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${minecraft_version}-${version}-forge"
    versionName = "${mod_name}-${minecraft_version}-${version}-forge"
    versionType = release_type
    uploadFile = jar
    gameVersions = ["${minecraft_version}"]
    loaders = ["forge"]
    dependencies = [
            new VersionDependency("journeymap", "${journeymap_doc_version}+forge", "required")
    ]
    changelog.set(providers.provider {
        file("$project.buildDir/doc/changelog.md").text
    })
}
